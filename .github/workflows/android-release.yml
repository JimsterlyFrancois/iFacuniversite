name: Android signed release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      # package.json is filtered by the detector to ignore web-only dependencies.
      - ".github/workflows/android-release.yml"
      - "package.json"
      - "capacitor.config.json"
      - "client/src/nativeStorage.js"
      - "client/public/ifac-logo.svg"
      - "scripts/generate-android-icons.py"
      - "scripts/configure-android-release.mjs"
      - "scripts/should-build-android-release.mjs"

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.check.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Detect native changes
        id: check
        env:
          ANDROID_RELEASE_EVENT: ${{ github.event_name }}
          ANDROID_RELEASE_REF_TYPE: ${{ github.ref_type }}
          ANDROID_RELEASE_BEFORE: ${{ github.event.before }}
          ANDROID_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/should-build-android-release.mjs

  release:
    needs: detect
    if: needs.detect.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Configure ANDROID_KEYSTORE_BASE64 in repository Actions secrets."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Configure ANDROID_KEYSTORE_PASSWORD in repository Actions secrets."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Configure ANDROID_KEY_ALIAS in repository Actions secrets."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Configure ANDROID_KEY_PASSWORD in repository Actions secrets."; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Build web assets for the mobile app
        run: npm run build
        env:
          VITE_API_BASE_URL: https://i-facuniversite.vercel.app

      - name: Generate Android native project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android launcher icons from the iFac logo
        run: |
          python3 -m venv "$RUNNER_TEMP/ifac-icon-venv"
          "$RUNNER_TEMP/ifac-icon-venv/bin/python" -m pip install --disable-pip-version-check --quiet CairoSVG
          "$RUNNER_TEMP/ifac-icon-venv/bin/python" scripts/generate-android-icons.py

      - name: Prepare permanent release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ifac-release.keystore"
          test -s "$RUNNER_TEMP/ifac-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ifac-release.keystore" >> "$GITHUB_ENV"

      - name: Configure signed release build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-build.{0}', github.run_number) }}
        run: npm run android:configure-release

      - name: Build signed APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-build.{0}', github.run_number) }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify signed APK
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ifac-universite-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
