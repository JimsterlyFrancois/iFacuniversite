name: Build check

on:
  push:
    branches:
      - main
      - integration/ifac-plus-base
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server/index.js
      - name: Build frontend
        run: npm run build
